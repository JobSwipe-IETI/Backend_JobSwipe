spring.application.name=JobSwipe
server.port=8081
spring.profiles.active=${PROFILE:dev}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# JPA
spring.jpa.open-in-view=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5

# OAuth & JWT
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.jwt.issuer=${APP_JWT_ISSUER}
app.jwt.access-token-expiration-seconds=${APP_JWT_EXPIRATION_SECONDS}
app.jwt.secret=${APP_JWT_SECRET}

# AI Service
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
app.recommendations.cache.ttl-seconds=${RECOMMENDATIONS_CACHE_TTL_SECONDS:1800}

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.docExpansion=none
springdoc.show-actuator=false
