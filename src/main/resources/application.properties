spring.application.name=JobSwipe
server.port=8081
spring.profiles.active=${PROFILE:dev}
spring.cache.type=${SPRING_CACHE_TYPE:redis}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# JPA
spring.jpa.open-in-view=true

# OAuth & JWT
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.jwt.issuer=${APP_JWT_ISSUER}
app.jwt.access-token-expiration-seconds=${APP_JWT_EXPIRATION_SECONDS}
app.jwt.secret=${APP_JWT_SECRET}

# AI Service
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
app.recommendations.cache.ttl-seconds=${RECOMMENDATIONS_CACHE_TTL_SECONDS:1800}

# Redis Cache
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}

app.cache.ttl.vacancies-seconds=${APP_CACHE_TTL_VACANCIES_SECONDS:60}
app.cache.ttl.company-activity-seconds=${APP_CACHE_TTL_COMPANY_ACTIVITY_SECONDS:45}
app.cache.ttl.company-pipeline-seconds=${APP_CACHE_TTL_COMPANY_PIPELINE_SECONDS:45}
app.cache.ttl.applicants-seconds=${APP_CACHE_TTL_APPLICANTS_SECONDS:45}
app.cache.ttl.matches-seconds=${APP_CACHE_TTL_MATCHES_SECONDS:30}

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.docExpansion=none
springdoc.show-actuator=false
