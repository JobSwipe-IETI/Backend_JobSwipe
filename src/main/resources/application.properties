spring.application.name=JobSwipe
server.port=8081
spring.profiles.active=${PROFILE:dev}
spring.cache.type=${SPRING_CACHE_TYPE:simple}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1800000}

# JPA
spring.jpa.open-in-view=false

# OAuth & JWT
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.jwt.issuer=${APP_JWT_ISSUER}
app.jwt.access-token-expiration-seconds=${APP_JWT_EXPIRATION_SECONDS}
app.jwt.secret=${APP_JWT_SECRET}

# AI Service
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
app.recommendations.cache.ttl-seconds=${RECOMMENDATIONS_CACHE_TTL_SECONDS:1800}
app.supabase.realtime.enabled=${SUPABASE_REALTIME_ENABLED:true}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.realtime.messages-table=${SUPABASE_MESSAGES_TABLE:chat_messages_realtime}
app.supabase.realtime.notifications-table=${SUPABASE_NOTIFICATIONS_TABLE:notification_events_realtime}

# Redis Cache
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}

app.cache.ttl.vacancies-seconds=${APP_CACHE_TTL_VACANCIES_SECONDS:60}
app.cache.ttl.company-activity-seconds=${APP_CACHE_TTL_COMPANY_ACTIVITY_SECONDS:10}
app.cache.ttl.company-pipeline-seconds=${APP_CACHE_TTL_COMPANY_PIPELINE_SECONDS:10}
app.cache.ttl.applicants-seconds=${APP_CACHE_TTL_APPLICANTS_SECONDS:20}
app.cache.ttl.matches-seconds=${APP_CACHE_TTL_MATCHES_SECONDS:10}
app.cache.ttl.applications-seconds=${APP_CACHE_TTL_APPLICATIONS_SECONDS:10}

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.docExpansion=none
springdoc.show-actuator=false

# Actuator metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus,httpexchanges
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.jobswipe.api.request.duration=true
management.metrics.distribution.percentiles.jobswipe.api.request.duration=0.5,0.9,0.95,0.99
